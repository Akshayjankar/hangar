  <path d="M16 42L20 20H28L32 42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Cab / Observation Deck -->
  <path d="M14 20H34L31 12H17L14 20Z" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Radar Dish / Beacon Ring -->
  <path d="M19 12C19 9.23858 21.2386 7 24 7C26.7614 7 29 9.23858 29 12" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="24" cy="6" r="2.5" fill="#00E5FF" />
  <!-- Runway Horizon Line -->
  <line x1="6" y1="42" x2="42" y2="42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
</svg>

